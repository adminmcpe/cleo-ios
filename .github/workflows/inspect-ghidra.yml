name: Inspect public GTA iOS Ghidra symbols

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-14
    steps:
      - name: Checkout CLEO fork
        uses: actions/checkout@v4

      - name: Clone public Ghidra project with LFS
        run: |
          git lfs install
          git clone https://github.com/squ1dd13/gtasa-ios-ghidra.git /tmp/gtasa-ios-ghidra
          cd /tmp/gtasa-ios-ghidra
          git lfs pull

      - name: Locate symbol strings in Ghidra database
        run: |
          set +e
          echo "== Large project files =="
          find /tmp/gtasa-ios-ghidra -type f -size +1M -print
          echo "== gMobileMenu / Radar symbol strings =="
          while IFS= read -r f; do
            echo "--- $f ---"
            strings -a "$f" | grep -E -B 4 -A 8 'gMobileMenu|ms_RadarTrace|CRadar' | head -300
          done < <(find /tmp/gtasa-ios-ghidra -type f -size +1M)
